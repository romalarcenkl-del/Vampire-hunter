name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q "*.zip"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix project for standalone build
        run: |
          APP=$(dirname "$(find . -name vite.config.ts -not -path '*/node_modules/*' | head -1)")
          echo "APP=$APP" >> $GITHUB_ENV
          cd "$APP"
          cat > vite.config.ts <<'VITE'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";
          import path from "path";
          export default defineConfig({
            base: "/",
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: { "@": path.resolve(import.meta.dirname, "src") },
              dedupe: ["react", "react-dom"],
            },
            build: { outDir: "dist", emptyOutDir: true },
          });
          VITE
          node -e '
          const fs=require("fs");
          const p=JSON.parse(fs.readFileSync("package.json"));
          const v={"vite":"^7.0.0","@vitejs/plugin-react":"^5.0.0","tailwindcss":"^4.1.0","@tailwindcss/vite":"^4.1.0","react":"^19.1.0","react-dom":"^19.1.0","@types/react":"^19.1.0","@types/react-dom":"^19.1.0","@types/node":"^22.0.0","@tanstack/react-query":"^5.60.0","framer-motion":"^11.18.0","lucide-react":"^0.468.0","clsx":"^2.1.1","tailwind-merge":"^3.0.0","class-variance-authority":"^0.7.1","zod":"^3.25.0"};
          for(const k of Object.keys(p.devDepend
